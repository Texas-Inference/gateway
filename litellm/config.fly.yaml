# Production config for Fly.io. Safe to commit: contains NO secrets.
# Secrets are injected as Fly secrets and resolved here with LiteLLM's native
# "os.environ/<VAR>" syntax (this image does NOT expand ${VAR} placeholders):
#   SILICONFLOW_API_KEY  -> upstream model key
#   LITELLM_MASTER_KEY   -> proxy master key (read directly from env by LiteLLM)
#   DATABASE_URL         -> LiteLLM's own database on superstackai-db
#   REDIS_URL            -> Redis for key cache + rate limits

model_list:
  - model_name: "deepseek-v3"
    litellm_params:
      model: "openai/deepseek-ai/DeepSeek-V3"
      api_base: "https://api.siliconflow.com/v1"
      api_key: "os.environ/SILICONFLOW_API_KEY"
    model_info:
      input_cost_per_token: 1e-5
      output_cost_per_token: 4e-5

  # Self-hosted (Qwen test harness). Cost MUST be non-zero here so LiteLLM
  # enforces budgets — zero-cost models bypass all budget checks.
  # api_base is an ephemeral quick tunnel; update it (or use a named tunnel).
  - model_name: "selfhost-test"
    litellm_params:
      model: "openai/qwen-tiny"
      api_base: "https://sur-sons-ethnic-grad.trycloudflare.com/v1"
      api_key: "os.environ/SELFHOST_DS_KEY"
    model_info:
      input_cost_per_token: 1e-6
      output_cost_per_token: 2e-6

general_settings:
  telemetry: false
  disable_spend_logs: false
  store_model_in_db: true

litellm_settings:
  num_retries: 0
  request_timeout: 120
  drop_params: true
